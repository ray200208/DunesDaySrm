<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowLink — Chennai Transit Operations</title>
<style>
:root, [data-theme="dark"] {
  --bg-grad: radial-gradient(ellipse at 50% -10%, #2f170c 0%, #170d07 45%, #0a0503 100%);
  --bg-elev: rgba(20, 12, 8, 0.94);
  --surf: #140c08;
  --surf-sub: #0c0704;
  --surf-hover: #1f120a;
  --line: rgba(249, 115, 22, 0.14);
  --line-strong: rgba(249, 115, 22, 0.28);
  --ink: #FDF8F5;
  --mut: #A89B91;
  --dim: #73675F;
  --ac: #F97316;
  --ac-hover: #FB923C;
  --ac-soft: rgba(249, 115, 22, 0.16);
  --cyan: #F97316;
  --cyan-soft: rgba(249, 115, 22, 0.14);
  --h: #EF4444;
  --m: #F59E0B;
  --l: #10B981;
  --bh-bg: rgba(239, 68, 68, 0.18);
  --bh-border: rgba(239, 68, 68, 0.48);
  --bm-bg: rgba(245, 158, 11, 0.18);
  --bm-border: rgba(245, 158, 11, 0.48);
  --bl-bg: rgba(16, 185, 129, 0.18);
  --bl-border: rgba(16, 185, 129, 0.48);
  --alert-bg: rgba(180, 40, 20, 0.18);
  --alert-line: rgba(239, 68, 68, 0.45);
  --sim-bg: rgba(249, 115, 22, 0.14);
  --sim-line: rgba(249, 115, 22, 0.50);
  --crush-row: rgba(180, 40, 20, 0.22);
  --sea: #140b06;
  --sea-line: #26160d;
  --sea-ink: #8c766b;
  color-scheme: dark;
  box-sizing: border-box;
}

[data-theme="light"] {
  --bg-grad: radial-gradient(ellipse at 50% -10%, #FFF7ED 0%, #F8FAFC 45%, #F1F5F9 100%);
  --bg-elev: rgba(255, 255, 255, 0.96);
  --surf: #FFFFFF;
  --surf-sub: #F8FAFC;
  --surf-hover: #F1F5F9;
  --line: rgba(15, 23, 42, 0.10);
  --line-strong: rgba(249, 115, 22, 0.35);
  --ink: #0F172A;
  --mut: #64748B;
  --dim: #94A3B8;
  --ac: #EA580C;
  --ac-hover: #C2410C;
  --ac-soft: rgba(234, 88, 12, 0.10);
  --cyan: #0284C7;
  --cyan-soft: rgba(2, 132, 199, 0.10);
  --h: #DC2626;
  --m: #D97706;
  --l: #059669;
  --bh-bg: rgba(220, 38, 38, 0.10);
  --bh-border: rgba(220, 38, 38, 0.30);
  --bm-bg: rgba(217, 119, 6, 0.10);
  --bm-border: rgba(217, 119, 6, 0.30);
  --bl-bg: rgba(5, 150, 105, 0.10);
  --bl-border: rgba(5, 150, 105, 0.30);
  --alert-bg: rgba(254, 242, 242, 0.95);
  --alert-line: rgba(239, 68, 68, 0.35);
  --sim-bg: rgba(255, 247, 237, 0.95);
  --sim-line: rgba(249, 115, 22, 0.45);
  --crush-row: rgba(254, 226, 226, 0.55);
  --sea: #E0F2FE;
  --sea-line: #BAE6FD;
  --sea-ink: #0369A1;
  color-scheme: light;
}

[data-theme="light"] .map {
  background: radial-gradient(circle at 50% 35%, #FFFFFF 0%, #F8FAFC 100%);
  border: 1px solid rgba(15, 23, 42, 0.10);
}
[data-theme="light"] .auth-card {
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(15, 23, 42, 0.12);
  box-shadow: 0 24px 64px rgba(15, 23, 42, 0.10), 0 0 32px rgba(249, 115, 22, 0.08);
}
[data-theme="light"] #mapTooltip {
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid rgba(15, 23, 42, 0.14);
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
  color: var(--ink);
}
[data-theme="light"] .card:hover {
  box-shadow: 0 12px 34px rgba(15, 23, 42, 0.08), 0 0 24px rgba(249, 115, 22, 0.08);
}
[data-theme="light"] .tile:hover {
  box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06);
}
[data-theme="light"] dialog::backdrop {
  background: rgba(15, 23, 42, 0.40);
}
[data-theme="light"] .empty {
  background: rgba(241, 245, 249, 0.85);
  color: var(--mut);
}
[data-theme="light"] .xai-panel {
  background: radial-gradient(circle at 10% 10%, rgba(2, 132, 199, 0.06) 0%, #FFFFFF 100%) !important;
  border-color: rgba(2, 132, 199, 0.30) !important;
}
[data-theme="light"] .splash-overlay {
  background: radial-gradient(circle at 50% 45%, #F8FAFC 0%, #E2E8F0 65%, #CBD5E1 100%);
}
[data-theme="light"] .splash-bar-track {
  background: rgba(15, 23, 42, 0.10);
}
[data-theme="light"] .b-H { color: #B91C1C; }
[data-theme="light"] .b-M { color: #B45309; }
[data-theme="light"] .b-L { color: #047857; }
[data-theme="light"] .tile b.val-h { color: #DC2626; }
[data-theme="light"] .tile b.val-m { color: #D97706; }
[data-theme="light"] .all-clear-card {
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.12) 0%, #FFFFFF 100%);
  border-color: rgba(16, 185, 129, 0.35);
  box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
}

.theme-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--surf);
  color: var(--ink);
  border-radius: 8px;
  padding: 5px 11px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s ease;
}
.theme-toggle-btn:hover {
  border-color: var(--line-strong);
  background: var(--surf-hover);
  color: var(--ac);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font: 14px/1.55 "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--bg-grad) fixed;
  -webkit-font-smoothing: antialiased;
}
code, .mono {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.sr { position: absolute; left: -9999px; }

/* ============ Keyframe Animations (Login, Brand Splash & Map Pulse) ============ */
@keyframes splashScaleIn {
  0% { opacity: 0; transform: scale(0.72) translateY(12px); }
  55% { opacity: 1; transform: scale(1.04) translateY(0); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes ringPulse {
  0% { transform: scale(0.88); opacity: 0.85; }
  70% { transform: scale(1.38); opacity: 0; }
  100% { transform: scale(1.38); opacity: 0; }
}
@keyframes compassSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes barSweep {
  0% { width: 8%; }
  100% { width: 100%; }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ Gatekeeper Login View ============ */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-card {
  width: min(430px, 94vw);
  background: rgba(19, 24, 34, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 18px;
  padding: 32px 30px 28px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 40px rgba(249, 115, 22, 0.08);
  backdrop-filter: blur(16px);
  animation: fadeIn 0.35s ease-out;
}
.auth-logo-box {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}
.auth-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0;
}
.auth-sub {
  font-size: 12.5px;
  color: var(--mut);
  margin: 3px 0 0;
}
.auth-err {
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(239, 68, 68, 0.16);
  border: 1px solid rgba(239, 68, 68, 0.45);
  color: #FCA5A5;
  font-size: 12.5px;
  font-weight: 500;
  margin-bottom: 14px;
}
.auth-hint {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--mut);
}

/* ============ Animated Brand Splash Overlay (1.4s Entrance) ============ */
.splash-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(circle at 50% 45%, #1A2639 0%, #090D14 65%, #05070A 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.splash-core {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: splashScaleIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.splash-emblem-wrap {
  position: relative;
  width: 116px;
  height: 116px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 22px;
}
.splash-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(6, 182, 212, 0.45);
  animation: ringPulse 1.35s ease-out infinite;
}
.splash-ring-2 {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1.5px dashed rgba(249, 115, 22, 0.45);
  animation: compassSpin 8s linear infinite;
}
.splash-bar-track {
  width: 240px;
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 18px;
}
.splash-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ac), var(--cyan));
  border-radius: 99px;
  animation: barSweep 1.3s ease-out forwards;
}

/* ============ Top Command Center Header ============ */
.top {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  padding: 8px 24px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-elev);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 30;
  flex-wrap: wrap;
}
.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: 6px;
}
.brand-title {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.cumta-badge {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--ac);
  background: rgba(249, 115, 22, 0.12);
  border: 1px solid rgba(249, 115, 22, 0.38);
  padding: 2px 7px;
  border-radius: 4px;
}
.sp { flex: 1; }
.seg {
  display: inline-flex;
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  border: 0;
  background: transparent;
  color: var(--mut);
  padding: 5px 13px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
  transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] {
  background: var(--ac);
  color: #ffffff;
}
.nav {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.nav button {
  border: 0;
  background: none;
  padding: 8px 14px;
  border-radius: 6px;
  color: var(--mut);
  font-size: 13.5px;
  font-weight: 500;
  position: relative;
  transition: color .15s, background .15s;
}
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] {
  color: var(--ac);
  font-weight: 600;
  background: rgba(249, 115, 22, 0.09);
}
.nav button[aria-current="page"]::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 0;
  height: 2px;
  background: var(--ac);
  border-radius: 2px;
}
.rec-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: var(--h);
  margin-left: 6px;
  vertical-align: middle;
}
.btn {
  border: 1px solid var(--line);
  background: var(--surf);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 13px;
  font-weight: 500;
  font-size: 13px;
  transition: border-color .15s, background .15s, box-shadow .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}
.btn:hover {
  border-color: var(--line-strong);
  background: var(--surf-hover);
}
.btn.pri {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
  font-weight: 600;
}
.btn.pri:hover {
  background: var(--ac-hover);
  border-color: var(--ac-hover);
}
.btn.sm { padding: 4px 10px; font-size: 12px; }
select, input, textarea {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  background: var(--surf);
  color: var(--ink);
  font-size: 13px;
}
select:hover, input:hover { border-color: var(--line-strong); }

main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 24px 24px 56px;
}

/* ============ Urgent Alert Banner ============ */
.alert {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  padding: 11px 16px;
  border: 1px solid var(--alert-line);
  background: var(--alert-bg);
  box-shadow: 0 0 28px rgba(239, 68, 68, 0.12);
  border-radius: 12px;
  margin-bottom: 22px;
}
.alert-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--h);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.alert p { margin: 0; flex: 1; min-width: 220px; font-size: 13.5px; }
.detail {
  margin: -12px 0 20px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surf);
}

/* ============ Metric & Risk Badges ============ */
.badge {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 2px 10px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 11.5px;
  border: 1px solid;
  white-space: nowrap;
}
.b-H { border-color: var(--bh-border); background: var(--bh-bg); color: #F87171; }
.b-H i { color: var(--h); }
.b-M { border-color: var(--bm-border); background: var(--bm-bg); color: #FBBF24; }
.b-M i { color: var(--m); }
.b-L { border-color: var(--bl-border); background: var(--bl-bg); color: #34D399; }
.b-L i { color: var(--l); }
.badge i { font-style: normal; font-size: 10px; }

.chip {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  color: var(--mut);
  border: 1px dashed var(--line-strong);
  border-radius: 5px;
  padding: 1px 7px;
  white-space: nowrap;
}
.master-depot-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 600;
  color: #38BDF8;
  background: rgba(6, 182, 212, 0.12);
  border: 1px solid rgba(6, 182, 212, 0.35);
  border-radius: 6px;
  padding: 2px 8px;
}

/* ============ 4 KPI Summary Tiles ============ */
.tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin: 16px 0 26px;
}
@media (max-width: 920px) {
  .tiles { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .tiles { grid-template-columns: 1fr; }
}
.tile {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  background: var(--surf);
  transition: border-color .18s, box-shadow .18s;
}
.tile:hover {
  border-color: var(--line-strong);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
}
.tile span {
  display: block;
  color: var(--mut);
  font-size: 12.5px;
  margin-bottom: 8px;
}
.tile b {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
  font-family: "JetBrains Mono", ui-monospace, monospace;
}
.tile b .sym-h { color: var(--h); font-size: 18px; }
.tile b .sym-m { color: var(--m); font-size: 18px; }
.tile b.val-h { color: #F87171; }
.tile b.val-m { color: #FBBF24; }
.tile b.val-ac { color: var(--ac); }

h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; color: var(--ink); }
h2 { font-size: 16px; font-weight: 700; margin: 0 0 10px; color: var(--ink); }
h3 { font-size: 14px; font-weight: 600; margin: 12px 0 6px; color: var(--ink); }
.mut { color: var(--mut); }

/* ============ Depot Pill Filter Row ============ */
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 10px;
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0 18px;
  max-height: 114px;
  overflow-y: auto;
  padding: 2px 0;
}
.chips button {
  border: 1px solid var(--line);
  background: var(--surf);
  color: var(--mut);
  border-radius: 999px;
  padding: 6px 15px;
  font-size: 12.5px;
  font-weight: 500;
  transition: all .15s;
}
.chips button:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}
.chips button[aria-pressed="true"] {
  background: var(--ac);
  color: #FFFFFF;
  border-color: var(--ac);
  font-weight: 700;
  box-shadow: 0 0 18px rgba(249, 115, 22, 0.40);
}

/* ============ Spacious Route Cards & Hover-to-Glow SVG Maps ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(365px, 1fr));
  gap: 18px;
}
.card {
  display: flex;
  flex-direction: column;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surf);
  padding: 18px;
  transition: border-color .18s, transform .18s, box-shadow .18s;
}
.card:hover {
  border-color: rgba(249, 115, 22, 0.45);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.50), 0 0 24px rgba(249, 115, 22, 0.12);
  transform: translateY(-2px);
}
.card .row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.card-title {
  font-weight: 700;
  font-size: 15.5px;
  color: var(--ink);
  line-height: 1.3;
}
.card-sub {
  color: var(--mut);
  font-size: 12.5px;
  margin-top: 3px;
}
.map {
  width: 100%;
  min-height: 168px;
  display: block;
  background: radial-gradient(circle at 50% 35%, #1d1009 0%, #0d0704 100%);
  border: 1px solid rgba(249, 115, 22, 0.14);
  border-radius: 12px;
  overflow: visible;
}
.map.map-lg {
  min-height: 280px;
}
.map-seg {
  cursor: pointer;
  transition: stroke-width 0.16s ease, filter 0.16s ease, opacity 0.16s ease;
}
.map-seg-H:hover {
  stroke-width: 8px !important;
  filter: url(#glow-H);
}
.map-seg-M:hover {
  stroke-width: 7px !important;
  filter: url(#glow-M);
}
.map-seg-L:hover {
  stroke-width: 6px !important;
  filter: url(#glow-L);
}
.map-stop-group {
  cursor: pointer;
}
.map-stop-ring {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.map-stop-group:hover .map-stop-ring {
  opacity: 0.95;
  transform: scale(1.6);
}
.map-stop-group:hover .map-stop-dot {
  stroke: var(--ac);
  stroke-width: 2.5;
}
.card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 13px;
  padding-top: 6px;
  font-size: 12.5px;
}
.card-metric {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  color: var(--mut);
}
.card-link {
  color: var(--ac);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* ============ Floating Interactive SVG Map Tooltip ============ */
#mapTooltip {
  position: fixed;
  z-index: 9500;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -112%);
  background: rgba(11, 15, 23, 0.96);

/* ============ 3. Interactive Hover-to-Glow SVG Route Map with Tooltips ============ */
function MapView(r, seg, o = {}) {
  const s = r.stops || [];
  const paths = r.segment_paths || [];
  const loads = r.segment_loads || [];
  const segStr = String(seg || 'LLLLL');
  const basePax = Math.max(18, Math.round(65 * ((r.pressure_pct || 95) / 100)));

  if (!s.length) {
    return `<div class="empty" style="min-height:${o.mini ? 110 : 280}px;display:flex;align-items:center;justify-content:center">No corridor coordinates available</div>`;
  }

  // 1. Calculate bounding box of stop nodes
  const xs = s.map(p => p.x);
  const ys = s.map(p => p.y);
  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const spanX = Math.max(8, maxX - minX);
  const spanY = Math.max(6, maxY - minY);

  // 2. Setup viewport dimensions and dynamic scaling
  const isMini = !!o.mini;
  const vw = isMini ? 320 : 640;
  const vh = isMini ? 120 : 280;

  // Margin padding: mini has no text labels, large has 84px X pad and 44px Y pad
  const padX = isMini ? 26 : 84;
  const padY = isMini ? 18 : 44;
  const usableW = vw - 2 * padX;
  const usableH = vh - 2 * padY;

  const scale = Math.min(usableW / spanX, usableH / spanY);
  const midX = (minX + maxX) / 2;
  const midY = (minY + maxY) / 2;

  const mapX = x => ((x - midX) * scale + vw / 2);
  const mapY = y => ((y - midY) * scale + vh / 2);

  // 3. Render Segments (Paths or Lines)
  let g = '';
  for (let i = 0; i < s.length - 1; i++) {
    const k = segStr[i] || 'L';
    const a = s[i], b = s[i + 1];
    const rk = RISK[k] || RISK.L;
    const sw = (k === 'H' ? (isMini ? 4.0 : 6.0) : k === 'M' ? (isMini ? 3.4 : 5.0) : (isMini ? 2.8 : 4.0));
    const loadObj = loads[i] || {};
    const segName = loadObj.segment_name || `${a.name} → ${b.name}`;
    const segPax = loadObj.onboard_pax || (k === 'H' ? Math.max(68, basePax) : k === 'M' ? 58 : 38);
    const segLf = loadObj.load_factor_pct || Math.round((segPax / 65) * 100);
    const tipAttr = `data-tip-seg="${esc(segName)}" data-tip-pax="${segPax} pax (${segLf}% load factor)" data-tip-risk="${esc(rk.l)}"`;

    if (paths[i]) {
      const transformedPath = paths[i].replace(/(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g, (_, px, py) => {
        return `${mapX(+px).toFixed(1)} ${mapY(+py).toFixed(1)}`;
      });
      g += `<path class="map-seg map-seg-${k}" d="${transformedPath}" fill="none" stroke="${rk.c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${tipAttr}/>`;
    } else {
      g += `<line class="map-seg map-seg-${k}" x1="${mapX(a.x).toFixed(1)}" y1="${mapY(a.y).toFixed(1)}" x2="${mapX(b.x).toFixed(1)}" y2="${mapY(b.y).toFixed(1)}" stroke="${rk.c}" stroke-width="${sw}" stroke-linecap="round" ${tipAttr}/>`;
    }
  }

  // 4. Render Stop Nodes and Alternating Labels with Background Pills
  let n = '';
  s.forEach((p, idx) => {
    const sx = mapX(p.x);
    const sy = mapY(p.y);
    const stopTip = `data-tip-seg="Stage ${idx + 1}: ${esc(p.name)}" data-tip-pax="Route ${esc(r.route || r.route_num || '')} Stop" data-tip-risk="Active ETM Stage"`;

    n += `<g class="map-stop-group" ${stopTip}>
      <circle class="map-stop-ring" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${isMini ? 5 : 8}" fill="none" stroke="var(--ac)" stroke-width="1.2"/>
      <circle class="map-stop-dot" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${isMini ? 3 : 5}" fill="var(--surf)" stroke="var(--ink)" stroke-width="${isMini ? 1.5 : 2}"/>
    </g>`;

    if (!isMini) {
      const isAbove = (idx % 2 === 0);
      const labelY = isAbove ? (sy - 13) : (sy + 18);
      const nameStr = p.name || `Stop ${idx + 1}`;
      const charLen = nameStr.length;
      const pillW = Math.min(180, Math.max(48, charLen * 6.5 + 14));

      n += `<g class="map-stop-label" pointer-events="none">
        <rect x="${(sx - pillW / 2).toFixed(1)}" y="${(labelY - 11).toFixed(1)}" width="${pillW}" height="17" rx="3" fill="var(--bg-elev)" stroke="var(--line-strong)" stroke-width="1"/>
        <text x="${sx.toFixed(1)}" y="${(labelY + 2).toFixed(1)}" text-anchor="middle" font-size="11px" font-weight="600" fill="var(--ink)" font-family="'Inter', system-ui, sans-serif">${esc(nameStr)}</text>
      </g>`;
    }
  });

  return `<svg class="map ${isMini ? '' : 'map-lg'}" viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Interactive route map of ${esc(r.name || r.route_num)}">
    <defs>
      <filter id="glow-H"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.95"/></filter>
      <filter id="glow-M"><feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.85"/></filter>
      <filter id="glow-L"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10B981" flood-opacity="0.75"/></filter>
    </defs>
    ${g}${n}
  </svg>`;
}

/* ============ 4. Depot-Filtered Recommendations View & Scenario Compare ============ */
function ScenarioCompare(r, rec) {
  const a = S.sim.act;
  const baseP = S.simData ? Math.round(S.simData.base_pressure_pct) : Math.round(rec.pressure_pct || 140);
  const newP = S.simData ? Math.round(S.simData.new_pressure_pct) : Math.round(baseP * ACT[a].f);
  const baseCap = S.simData ? S.simData.base_capacity : ((rec.active_bus_runs || 5) * 65);
  const newCap = S.simData ? S.simData.new_capacity : (baseCap + (ACT[a].trips * 65));
  const baseSeg = S.simData ? S.simData.base_seg : (r ? r.seg : 'MHHHM');
  const newSeg = S.simData ? S.simData.new_seg : 'LMMLM';

  return `<div class="panel">
    <div class="simnote" role="note">
      Live What-If Simulation · ${S.simData ? esc(S.simData.summary) : 'Recalculating corridor capacity and segment load.'}
    </div>
    <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <span class="badge" style="background:rgba(16,185,129,0.18);border:1px solid #10B981;color:#10B981;padding:6px 14px;font-size:13px;font-weight:700">
        Projected Outcome: Overcrowding resolved, peak pressure reduced from ${baseP}% to ${newP}%
      </span>
      <button class="btn sm" data-a="resetsim">↺ Reset to Baseline</button>
    </div>
    <div class="q" role="group" aria-label="Scenario action">
      ${Object.entries(ACT).map(([k, v]) => `<button data-a="simact" data-v="${k}" aria-pressed="${a == k}">${v.l}</button>`).join('')}
    </div>
    ${r ? `<div class="two">
      <div><h3 style="color:#F87171;margin-top:0">Baseline (${baseP}% pressure)</h3>${MapView(r, baseSeg, { label: 'baseline' })}</div>
      <div><h3 style="color:#34D399;margin-top:0">Simulated (${newP}% pressure)</h3>${MapView(r, newSeg, { label: 'simulated' })}</div>
    </div>${Legend()}` : ''}
    <table>
      <thead><tr><th>Measure</th><th>Baseline</th><th>Simulated</th></tr></thead>
      <tbody>
        <tr><td>High-risk crush segments</td><td class="mono">${cnt(baseSeg, 'H')}</td><td class="mono"><b>${cnt(newSeg, 'H')}</b></td></tr>
        <tr><td>Corridor seat capacity</td><td class="mono">${baseCap} seats</td><td class="mono"><b>${newCap} seats</b></td></tr>
        <tr><td>Demand vs. capacity <span class="chip">XGBoost R²=0.81</span></td><td class="mono">${baseP}%</td><td class="mono"><b>${newP}%</b></td></tr>
      </tbody>
    </table>
  </div>`;
}

function RecDetail(rec) {
  const r = S.items.find(x => x.route == rec.route) || S.items[0];
  const p = Math.round(rec.pressure_pct || 140);
  const postP = Math.round(rec.post_pressure_pct || p * 0.75);
  const pctBar = Math.min(100, Math.round((p / 180) * 100));

  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px">
      <div>
        <span class="master-depot-pill">🏛️ ${esc(rec.master_depot_tag || ('Consolidated Master Depot: ' + (rec.depot || 'MTC')))}</span>
        <h2 style="margin:8px 0 4px">${esc(rec.title)}</h2>
      </div>
      ${Badge(rec.risk || 'H', true)}
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <span class="chip">Route: <b style="color:var(--ink)">${esc(rec.route)}${rec.short_route ? ' + ' + esc(rec.short_route) : ''}</b></span>
      <span class="chip">Window: <b style="color:var(--ink)">${esc(rec.time_window || '')}</b></span>
      <span class="chip">Baseline Pressure: <b style="color:#F87171">${p}%</b></span>
      <span class="chip">Post-Fix Pressure: <b style="color:#34D399">${postP}%</b></span>
    </div>

    <div style="margin-bottom:14px">
      <div class="mut" style="font-size:12px;margin-bottom:4px">Corridor Load Factor Progress (${p}% → ${postP}% target)</div>
      <div class="bar-wrap" style="max-width:100%;height:10px"><div class="bar-fill" style="width:${pctBar}%;background:linear-gradient(90deg,var(--ac),var(--h))"></div></div>
    </div>

    <dl>
      <dt>Problem</dt><dd>${esc(rec.why)}</dd>
      <dt>Affected Depot(s)</dt><dd><b>${esc(rec.depot || '')}</b>${rec.secondary_depot ? ` &amp; <b>${esc(rec.secondary_depot)}</b>` : ''}</dd>
      <dt>Proposed response</dt><dd><b>${esc(rec.response)}</b></dd>
    </dl>
    <p style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn pri" data-a="simulate">⚡ Simulate intervention</button>
      <button class="btn" data-a="openroute" data-v="${esc(rec.route)}" data-depot="${esc(rec.depot_code || '')}">Open Route 24h Timeline →</button>
    </p>
  </div>
  ${XAIPanel(rec.route, rec.depot_code || '', rec.hour ?? 8)}
  ${S.sim ? ScenarioCompare(r, rec) : ''}`;
}

function RecPage() {
  const depotObj = S.depots.find(d => d.depot_code == S.depot);
  const depotDisplayName = S.depot == 'ALL'
    ? 'All 33 MTC Depots'
    : (depotObj ? `${depotObj.short_name} (${depotObj.depot_code})` : `Depot ${S.depot}`);

  const filteredRecs = S.depot == 'ALL'
    ? S.recs
    : S.recs.filter(x =>
        x.depot_code == S.depot ||
        (Array.isArray(x.affected_depot_codes) && x.affected_depot_codes.includes(S.depot)) ||
        String(x.depot || '').toUpperCase().includes(`(${S.depot})`)
      );

  const rec = filteredRecs.find(x => x.id == S.rec) || filteredRecs[0] || null;

  return `<h1>Dispatch &amp; Corridor Consolidator Recommendations</h1>
  <p class="mut" style="margin:2px 0 12px">Depot-filtered standby injections and Consolidated Master Depot interventions · Showing: <b>${esc(depotDisplayName)}</b></p>

  ${DepotFilterPills()}

  ${S.loading
    ? '<div class="skel"></div>'
    : filteredRecs.length
      ? `<div class="recs">
          <div class="rl">
            ${filteredRecs.map((x, i) => {
              const k = x.risk || 'H';
              return `<button data-a="openrec" data-v="${esc(x.id)}" aria-current="${rec && rec.id == x.id}">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
                  <span class="mut mono" style="font-size:11.5px">#${i + 1} · ${esc(x.id)}</span>
                  ${Badge(k)}
                </div>
                <div style="margin-bottom:5px">
                  <span class="master-depot-pill" style="font-size:10.5px;padding:1px 6px">🏛️ ${esc(x.master_depot_tag || ('Master Depot: ' + (x.depot || 'MTC')))}</span>
                </div>
                <b>${esc(x.title)}</b>
                <div class="mut mono" style="font-size:11.5px;margin-top:4px">${esc(x.time_window || '')} · ${x.pressure_pct || ''}% pressure</div>
              </button>`;
            }).join('')}
          </div>
          <div>${rec ? RecDetail(rec) : ''}</div>
        </div>`
      : `<div class="all-clear-card" role="status">
          <div style="font-size:32px;margin-bottom:8px">✅</div>
          <h2 style="color:#10B981;margin:0 0 6px">All Clear — No active interventions needed for this depot.</h2>
          <p class="mut" style="margin:0 0 14px">All routes originating from or traversing ${esc(depotDisplayName)} are currently operating within standard 65-seat bus capacity thresholds.</p>
          <button class="btn" data-a="depot" data-v="ALL">View all network recommendations</button>
        </div>`}`;
}

function Incidents() {
  return `<h2 style="margin-top:32px">Open incident reports</h2>
  ${S.inc.length
    ? `<div class="panel" style="padding:0;overflow:hidden"><table>
        <thead><tr><th>ID</th><th>Type</th><th>Where</th><th>Time</th><th>Description</th></tr></thead>
        <tbody>
          ${S.inc.map(i => `<tr>
            <td class="mono"><b>${esc(i.id)}</b></td>
            <td>${esc(i.type)}</td>
            <td>${esc(i.where)}</td>
            <td class="mono">${esc(i.time)}</td>
            <td>${esc(i.desc)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>`
    : '<div class="empty">No open reports.</div>'}`;
}

function IncidentDialog() {
  const t = new Date().toTimeString().slice(0, 5);
  return `<dialog id="dlg" aria-labelledby="dt">
    ${S.sent
      ? `<h2 id="dt">Report submitted</h2>
         <p>${esc(S.sent.id)} was added to open incidents. <span class="chip">Live API</span></p>
         <button class="btn pri" data-a="closemodal">Close</button>`
      : `<form id="frm">
          <h2 id="dt">Report an operational incident</h2>
          <label for="f1">Issue type</label>
          <select id="f1" name="type">
            <option>Overcrowding</option>
            <option>Bus Bunching</option>
            <option>Stage Crush Load</option>
            <option>Breakdown</option>
          </select>
          <label for="f2">Route</label>
          <select id="f2" name="where">
            ${S.items.slice(0, 60).map(r => `<option value="${esc(r.route)} (${esc(r.name)})">${esc(r.route)} · ${esc(r.name)}</option>`).join('')}
          </select>
          <label for="f3">Time</label>
          <input id="f3" name="time" type="time" value="${t}" required>
          <label for="f4">Description</label>
          <textarea id="f4" name="desc" rows="3" placeholder="Describe passenger queue, headway gap, or road condition..." required></textarea>
          <p style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
            <button type="button" class="btn" data-a="closemodal">Cancel</button>
            <button class="btn pri">Submit report</button>
          </p>
        </form>`}
  </dialog>`;
}

/* ============ App View & State Transitions ============ */
function view() {
  if (!S.authed) {
    return LoginView();
  }
  if (S.splash) {
    return BrandSplashView();
  }
  let body = '';
  if (S.tab == 'rec') {
    body = RecPage();
  } else if (S.tier == 3) {
    body = Tier3HourPage();
  } else if (S.tier == 2) {
    body = Tier2RoutePage();
  } else {
    body = Tier1NetworkPage();
  }
  return `${Header()}<main>${AlertBanner()}${body}</main>${IncidentDialog()}`;
}

function render() {
  document.documentElement.setAttribute('data-theme', S.theme);
  const a = document.getElementById('app');
  a.innerHTML = view();
  const d = document.getElementById('dlg');
  if (d && S.modal && !d.open) {
    d.showModal();
    d.addEventListener('close', () => { S.modal = false; S.sent = null; render(); }, { once: true });
  }
}

async function fetchTier1Routes() {
  S.loading = true;
  render();
  const data = await api.routes(S.mode, S.depot, S.dow, S.hour, S.riskFilter, S.search);
  S.items = data.routes || [];
  S.totalRoutes = data.total_routes ?? S.items.length;
  S.kpi = data.kpi || { critical_count: 0, high_count: 0, normal_count: 0, avg_pressure_pct: 0 };
  if (data.depots && data.depots.length) S.depots = data.depots;
  S.shpBounds = data.shapefile_bounds || null;
  S.loading = false;
  render();
}

async function openTier2Route(routeId, depotCode) {
  S.tab = 'net';
  S.tier = 2;
  S.tierLoading = true;
  S.q = null;
  S.xaiAns = null;
  S.tier2Sim = null;
  S.tier3Sim = null;
  scrollTo(0, 0);
  render();
  S.tier2Data = await api.tier2Route(routeId, depotCode || S.depot, S.dow);
  S.tierLoading = false;
  render();
}

async function openTier3Hour(routeId, depotCode, hourVal) {
  S.tab = 'net';
  S.tier = 3;
  S.tierLoading = true;
  S.q = null;
  S.xaiAns = null;
  S.tier2Sim = null;
  S.tier3Sim = null;
  scrollTo(0, 0);
  render();
  S.tier3Data = await api.tier3Hour(routeId, hourVal, depotCode || (S.tier2Data && S.tier2Data.depot_code) || '', S.dow);
  S.tierLoading = false;
  render();
}

async function runSimCall(actKey) {
  const rec = S.recs.find(x => x.id == S.rec) || S.recs[0];
  if (!rec) return;
  const cfg = ACT[actKey] || ACT.add;
  try {
    S.simData = await api.simulate({
      route: rec.route,
      day_of_week: S.dow,
      hour: rec.hour ?? S.hour,
      action: actKey,
      extra_trips: rec.extra_buses || cfg.trips || 2
    });
  } catch (e) {
    S.simData = null;
  }
  render();
}

async function runTier3SimCall(routeNum, hourVal) {
  try {
    S.tier3Sim = await api.simulate({
      route: routeNum,
      day_of_week: S.dow,
      hour: hourVal,
      action: 'add',
      extra_trips: 2
    });
  } catch (e) {
    S.tier3Sim = null;
  }
  render();
}

async function runXaiCall(routeNum, depotCode, hourVal, questionKey, customQuery) {
  S.q = questionKey || 'custom';
  S.xaiLoading = true;
  render();
  try {
    S.xaiAns = await api.xaiExplain({
      route_num: routeNum || '102K',
      depot: depotCode || null,
      day_of_week: S.dow,
      hour: hourVal != null ? +hourVal : S.hour,
      question_key: questionKey || 'why_flagged',
      custom_query: customQuery || null
    });
  } catch (e) {
    S.xaiAns = {
      source: 'Offline Fallback',
      answer: 'Unable to reach /api/xai/explain endpoint.',
      metrics: {}
    };
  }
  S.xaiLoading = false;
  render();
}

async function initLoad() {
  S.loading = true;
  render();
  const [rData, al, recs, inc] = await Promise.all([
    api.routes(S.mode, S.depot, S.dow, S.hour, S.riskFilter, S.search),
    api.alert(S.mode),
    api.recs(S.mode),
    api.incidents()
  ]);
  S.items = rData.routes || [];
  S.totalRoutes = rData.total_routes ?? S.items.length;
  S.kpi = rData.kpi || { critical_count: 0, high_count: 0, normal_count: 0, avg_pressure_pct: 0 };
  S.depots = rData.depots || [];
  S.shpBounds = rData.shapefile_bounds || null;
  S.al = al || null;
  S.recs = recs || [];
  S.inc = inc || [];
  if (!S.rec && S.recs[0]) S.rec = S.recs[0].id;
  S.loading = false;
  render();
}

/* ============ Interactive SVG Map Hover Tooltip Listeners ============ */
const mapTipEl = document.getElementById('mapTooltip');
document.addEventListener('mouseover', e => {
  const segEl = e.target.closest('[data-tip-seg]');
  if (!segEl || !mapTipEl) return;
  const name = segEl.getAttribute('data-tip-seg') || '';
  const pax = segEl.getAttribute('data-tip-pax') || '';
  const risk = segEl.getAttribute('data-tip-risk') || '';
  mapTipEl.innerHTML = `<div style="font-weight:700;color:var(--ink)">${esc(name)}</div>
    <div class="mono" style="color:var(--cyan);margin-top:2px">${esc(pax)} · <span style="color:#F97316">${esc(risk)}</span></div>`;
  mapTipEl.classList.add('vis');
});
document.addEventListener('mousemove', e => {
  if (!mapTipEl || !mapTipEl.classList.contains('vis')) return;
  mapTipEl.style.left = e.clientX + 'px';
  mapTipEl.style.top = (e.clientY - 10) + 'px';
});
document.addEventListener('mouseout', e => {
  const segEl = e.target.closest('[data-tip-seg]');
  if (segEl && mapTipEl) {
    mapTipEl.classList.remove('vis');
  }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;

  if (a == 'toggletheme') {
    S.theme = S.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('flowlink_theme', S.theme);
    document.documentElement.setAttribute('data-theme', S.theme);
    return render();
  }
  if (a == 'logout') {
    sessionStorage.removeItem('flowlink_authed');
    sessionStorage.removeItem('dd_authed');
    S.authed = false;
    S.splash = false;
    S.loginErr = '';
    return render();
  }
  if (a == 'mode') {
    S.mode = v;
    Object.assign(S, { tier: 1, depot: 'ALL', riskFilter: 'ALL', search: '', rec: null, sim: null, simData: null, q: null, xaiAns: null });
    return initLoad();
  }
  if (a == 'alert') { S.alert = !S.alert; return render(); }
  if (a == 'depot') {
    S.depot = v;
    S.cardLimit = 60;
    S.sim = null;
    S.simData = null;
    if (S.tab == 'rec') {
      return render();
    }
    return fetchTier1Routes();
  }
  if (a == 'clearfilters') {
    S.depot = 'ALL';
    S.riskFilter = 'ALL';
    S.search = '';
    S.cardLimit = 60;
    return fetchTier1Routes();
  }
  if (a == 'morecards') { S.cardLimit += 80; return render(); }
  if (a == 'allcards') { S.cardLimit = 5000; return render(); }
  if (a == 'openroute') {
    return openTier2Route(v, b.dataset.depot || '');
  }
  if (a == 'backtier1') {
    S.tier = 1;
    S.q = null;
    S.xaiAns = null;
    return render();
  }
  if (a == 'backtier2') {
    S.tier = 2;
    S.q = null;
    S.xaiAns = null;
    return render();
  }
  if (a == 'opentier3') {
    const rId = S.tier2Data ? S.tier2Data.id : '102K';
    const dCode = S.tier2Data ? S.tier2Data.depot_code : '';
    return openTier3Hour(rId, dCode, +v);
  }
  if (a == 'tier2sim') {
    const rNum = b.dataset.route || (S.tier2Data && S.tier2Data.route_num) || '102K';
    try {
      S.tier2Sim = await api.simulate({
        route: rNum,
        day_of_week: S.dow,
        hour: S.hour,
        action: 'add',
        extra_trips: 2
      });
    } catch (e) {
      S.tier2Sim = null;
    }
    return render();
  }
  if (a == 'resettier2sim') {
    S.tier2Sim = null;
    return render();
  }
  if (a == 'tier3sim') {
    return runTier3SimCall(b.dataset.route || '102K', +(b.dataset.hour ?? S.hour));
  }
  if (a == 'resettier3sim') {
    S.tier3Sim = null;
    return render();
  }
  if (a == 'resetsim') {
    S.sim = null;
    S.simData = null;
    return render();
  }
  if (a == 'tab') {
    S.tab = v;
    if (v == 'net') S.tier = 1;
    if (v == 'rec' && !S.rec && S.recs[0]) S.rec = S.recs[0].id;
    return render();
  }
  if (a == 'openrec') {
    S.tab = 'rec';
    S.rec = v;
    S.sim = null;
    S.simData = null;
    S.q = null;
    S.xaiAns = null;
    S.alert = false;
    return render();
  }
  if (a == 'simulate') {
    S.sim = { act: 'add' };
    return runSimCall('add');
  }
  if (a == 'simact') {
    S.sim = { act: v };
    return runSimCall(v);
  }
  if (a == 'askxai') {
    return runXaiCall(b.dataset.route || '102K', b.dataset.depot || '', b.dataset.hour ?? S.hour, v, null);
  }
  if (a == 'report') { S.modal = true; S.sent = null; return render(); }
  if (a == 'closemodal') {
    const d = document.getElementById('dlg');
    S.modal = false;
    S.sent = null;
    d && d.open && d.close();
    return render();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id == 'dow') {
    S.dow = +e.target.value;
    if (S.tier == 3 && S.tier3Data) {
      return openTier3Hour(S.tier3Data.id, S.tier3Data.depot_code, S.tier3Data.hour);
    }
    if (S.tier == 2 && S.tier2Data) {
      return openTier2Route(S.tier2Data.id, S.tier2Data.depot_code);
    }
    return fetchTier1Routes();
  }
  if (e.target.id == 'hour') {
    S.hour = +e.target.value;
    if (S.tier == 3 && S.tier3Data) {
      return openTier3Hour(S.tier3Data.id, S.tier3Data.depot_code, S.hour);
    }
    return fetchTier1Routes();
  }
  if (e.target.id == 'riskSel') {
    S.riskFilter = e.target.value;
    return fetchTier1Routes();
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id == 'loginFrm') {
    e.preventDefault();
    const f = new FormData(e.target);
    const u = String(f.get('username') || '').trim();
    const p = String(f.get('password') || '').trim();
    if (u === 'admin' && p === '1234') {
      S.loginErr = '';
      S.authed = true;
      S.splash = true;
      sessionStorage.setItem('flowlink_authed', '1');
      sessionStorage.setItem('dd_authed', '1');
      render();
      initLoad();
      setTimeout(() => {
        S.splash = false;
        render();
      }, 1400);
    } else {
      S.loginErr = "Invalid operator credentials. Please enter username 'admin' and password '1234'.";
      render();
    }
    return;
  }
  if (e.target.id == 'searchFrm') {
    e.preventDefault();
    const inp = document.getElementById('searchInp');
    S.search = inp ? inp.value.trim() : '';
    return fetchTier1Routes();
  }
  if (e.target.id == 'xaifrm') {
    e.preventDefault();
    const f = new FormData(e.target);
    const qText = (f.get('custom_query') || '').trim();
    if (!qText) return;
    return runXaiCall(e.target.dataset.route || '102K', e.target.dataset.depot || '', e.target.dataset.hour ?? S.hour, 'custom_query', qText);
  }
  if (e.target.id != 'frm') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const incPayload = {
    type: f.get('type'),
    where: f.get('where'),
    time: f.get('time'),
    desc: f.get('desc')
  };
  const btn = e.target.querySelector('.pri');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  const created = await api.submitIncident(incPayload);
  S.inc.unshift(created);
  S.sent = created;
  const d = document.getElementById('dlg');
  d.close();
  S.modal = true;
  render();
});

if (S.authed) {
  initLoad();
} else {
  render();
}
</script>
</body>
</html>
