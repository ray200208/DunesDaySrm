<body>
<div id="app"></div>
<script>
const DOW_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const HOURS_24 = Array.from({ length: 24 }, (_, h) => ({
  h,
  label: `${String(h).padStart(2, '0')}:00–${String((h + 1) % 24).padStart(2, '0')}:00`
}));

const MODES = {
  MTC: { label: 'MTC bus network', groupLabel: 'Depot', noun: 'route' },
  Metro: { label: 'CMRL Metro network', groupLabel: 'Corridor', noun: 'line' },
  MRTS: { label: 'MRTS Suburban network', groupLabel: 'Line', noun: 'line' }
};

/* ============ FastAPI Service Layer ============ */
const api = {
  routes: async (mode, depot, dow, hour, risk, search) => {
    const qs = new URLSearchParams({
      mode: mode || 'MTC',
      depot: depot || 'ALL',
      day_of_week: dow ?? 3,
      hour: hour ?? 18,
      risk: risk || 'ALL',
      search: search || ''
    });
    return (await fetch('/api/routes?' + qs.toString())).json();
  },
  tier2Route: async (routeId, depot, dow) => {
    const qs = new URLSearchParams({ depot: depot || '', day_of_week: dow ?? 3 });
    return (await fetch(`/api/route/${encodeURIComponent(routeId)}?` + qs.toString())).json();
  },
  tier3Hour: async (routeId, hour, depot, dow) => {
    const qs = new URLSearchParams({ depot: depot || '', day_of_week: dow ?? 3 });
    return (await fetch(`/api/route/${encodeURIComponent(routeId)}/hour/${hour}?` + qs.toString())).json();
  },
  alert: async (mode) => (await fetch('/api/alert?mode=' + encodeURIComponent(mode))).json(),
  recs: async (mode) => (await fetch('/api/recs?mode=' + encodeURIComponent(mode))).json(),
  bottlenecks: async () => (await fetch('/api/bottlenecks')).json(),
  bunching: async () => (await fetch('/api/bunching')).json(),
  incidents: async () => (await fetch('/api/incidents')).json(),
  submitIncident: async (i) => (await fetch('/api/incidents', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(i)
  })).json(),
  simulate: async (payload) => (await fetch('/api/simulate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })).json(),
  xaiExplain: async (payload) => (await fetch('/api/xai/explain', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })).json()
};

const XAI_QUESTIONS = [
  { key: 'why_flagged', label: 'Why was this route & hour flagged?' },
  { key: 'confidence', label: 'How accurate is the XGBoost model?' },
  { key: 'simulation_impact', label: 'What is the impact of +1 bus or short-turn?' },
  { key: 'corridor_logic', label: 'Why consolidate via Master Depot?' }
];

const RISK = {
  H: { l: 'High (>120% crush)', short: 'High', g: '▲', c: 'var(--h)' },
  M: { l: 'Medium (100–120%)', short: 'Medium', g: '◆', c: 'var(--m)' },
  L: { l: 'Low (<100%)', short: 'Low', g: '●', c: 'var(--l)' }
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ============ Geographically Projected Curved SVG Map (routes_merged.shp) ============ */
function MapView(r, seg, o = {}) {
  const m = o.mini ? 1.55 : 1.15;
  const s = r.stops || [];
  const paths = r.segment_paths || [];
  const segStr = String(seg || 'LLLLL');
  let g = '', n = '';

  for (let i = 0; i < s.length - 1; i++) {
    const k = segStr[i] || 'L', a = s[i], b = s[i + 1];
    const rk = RISK[k] || RISK.L;
    const sw = (k == 'H' ? 2.4 : 1.75) * (o.mini ? 1.15 : 0.95);
    if (paths[i]) {
      g += `<path d="${paths[i]}" fill="none" stroke="${rk.c}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"><title>${esc(a.name)} → ${esc(b.name)}: ${rk.l}</title></path>`;
    } else {
      g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${rk.c}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round"><title>${esc(a.name)} → ${esc(b.name)}: ${rk.l}</title></line>`;
    }
    if (!o.mini) {
      g += `<text x="${((a.x + b.x) / 2).toFixed(1)}" y="${((a.y + b.y) / 2 - 2.3).toFixed(1)}" text-anchor="middle" font-size="2.5" font-weight="700" fill="${rk.c}">${rk.g}</text>`;
    }
  }

  s.forEach((p, idx) => {
    n += `<circle cx="${p.x}" cy="${p.y}" r="${o.mini ? 1.25 : 1.45}" fill="#0B0E14" stroke="#F9FAFB" stroke-width=".65"/>`;
    if (!o.mini) {
      const yOff = (idx % 2 == 0) ? 4.2 : -2.6;
      n += `<text x="${p.x}" y="${Math.max(4.5, Math.min(57.5, p.y + yOff))}" text-anchor="middle" font-size="2.1" fill="#E5E7EB">${esc(p.name)}</text>`;
    }
  });

  return `<svg class="map" viewBox="0 0 100 60" role="img" aria-label="Projected shapefile map of ${esc(r.name)}">
    <path d="M88 0 C85 18, 86 38, 89 60 L100 60 L100 0 Z" fill="var(--sea)" stroke="var(--sea-line)" stroke-width="0.4"/>
    <text x="91" y="7.5" font-size="2.0" fill="var(--sea-ink)" text-anchor="middle">Bay of Bengal</text>
    ${!o.mini ? `<text x="3.5" y="57.5" font-size="1.75" fill="var(--mut)">WGS84 Shapefile · Data/Public Transport/MTC/routes_merged.shp</text>` : ''}
    ${g}${n}
  </svg>`;
}

</div>`;

/* ============ Recommendations & Simulator Tab ============ */
function ScenarioCompare(r, rec) {
  const a = S.sim.act;
  const baseP = S.simData ? Math.round(S.simData.base_pressure_pct) : Math.round(rec.pressure_pct || 140);
  const newP = S.simData ? Math.round(S.simData.new_pressure_pct) : Math.round(baseP * ACT[a].f);
  const baseCap = S.simData ? S.simData.base_capacity : ((rec.active_bus_runs || 5) * 65);
  const newCap = S.simData ? S.simData.new_capacity : (baseCap + (ACT[a].trips * 65));
  const baseSeg = S.simData ? S.simData.base_seg : (r ? r.seg : 'MHHHM');
  const newSeg = S.simData ? S.simData.new_seg : 'LMMLM';

  return `<div class="panel">
    <div class="simnote" role="note">
      Live What-If Simulation · ${S.simData ? esc(S.simData.summary) : 'Recalculating corridor capacity and segment load.'}
    </div>
    <div class="q" role="group" aria-label="Scenario action">
      ${Object.entries(ACT).map(([k, v]) => `<button data-a="simact" data-v="${k}" aria-pressed="${a == k}">${v.l}</button>`).join('')}
    </div>
    ${r ? `<div class="two">
      <div><h3>Baseline (${baseP}% pressure)</h3>${MapView(r, baseSeg, { label: 'baseline' })}</div>
      <div><h3>Simulated (${newP}% pressure)</h3>${MapView(r, newSeg, { label: 'simulated' })}</div>
    </div>${Legend()}` : ''}
    <table>
      <thead><tr><th>Measure</th><th>Baseline</th><th>Simulated</th></tr></thead>
      <tbody>
        <tr><td>High-risk crush segments</td><td class="mono">${cnt(baseSeg, 'H')}</td><td class="mono"><b>${cnt(newSeg, 'H')}</b></td></tr>
        <tr><td>Corridor seat capacity</td><td class="mono">${baseCap} seats</td><td class="mono"><b>${newCap} seats</b></td></tr>
        <tr><td>Demand vs. capacity <span class="chip">XGBoost R²=0.81</span></td><td class="mono">${baseP}%</td><td class="mono"><b>${newP}%</b></td></tr>
      </tbody>
    </table>
  </div>`;
}

/* ============ App View & State Transitions ============ */
function view() {
  let body = '';
  if (S.tab == 'rec') {
    body = RecPage();
  } else if (S.tab == 'diag') {
    body = DiagnosticsPage();
  } else if (S.tier == 3) {
    body = Tier3HourPage();
  } else if (S.tier == 2) {
    body = Tier2RoutePage();
  } else {
    body = Tier1NetworkPage();
  }
  return `${Header()}<main>${AlertBanner()}${body}</main>${IncidentDialog()}`;
}

function render() {
  const a = document.getElementById('app');
  a.innerHTML = view();
  const d = document.getElementById('dlg');
  if (d && S.modal && !d.open) {
    d.showModal();
    d.addEventListener('close', () => { S.modal = false; S.sent = null; render(); }, { once: true });
  }
}

async function fetchTier1Routes() {
  S.loading = true;
  render();
  const data = await api.routes(S.mode, S.depot, S.dow, S.hour, S.riskFilter, S.search);
  S.items = data.routes || [];
  S.totalRoutes = data.total_routes ?? S.items.length;
  S.kpi = data.kpi || { critical_count: 0, high_count: 0, normal_count: 0, avg_pressure_pct: 0 };
  if (data.depots && data.depots.length) S.depots = data.depots;
  S.shpBounds = data.shapefile_bounds || null;
  S.loading = false;
  render();
}

async function openTier2Route(routeId, depotCode) {
  S.tab = 'net';
  S.tier = 2;
  S.tierLoading = true;
  S.q = null;
  S.xaiAns = null;
  S.tier3Sim = null;
  scrollTo(0, 0);
  render();
  S.tier2Data = await api.tier2Route(routeId, depotCode || S.depot, S.dow);
  S.tierLoading = false;
  render();
}

async function openTier3Hour(routeId, depotCode, hourVal) {
  S.tab = 'net';
  S.tier = 3;
  S.tierLoading = true;
  S.q = null;
  S.xaiAns = null;
  S.tier3Sim = null;
  scrollTo(0, 0);
  render();
  S.tier3Data = await api.tier3Hour(routeId, hourVal, depotCode || (S.tier2Data && S.tier2Data.depot_code) || '', S.dow);
  S.tierLoading = false;
  render();
}

async function runSimCall(actKey) {
  const rec = S.recs.find(x => x.id == S.rec) || S.recs[0];
  if (!rec) return;
  const cfg = ACT[actKey] || ACT.add;
  try {
    S.simData = await api.simulate({
      route: rec.route,
      day_of_week: S.dow,
      hour: rec.hour ?? S.hour,
      action: actKey,
      extra_trips: rec.extra_buses || cfg.trips || 2
    });
  } catch (e) {
    S.simData = null;
  }
  render();
}

async function runTier3SimCall(routeNum, hourVal) {
  try {
    S.tier3Sim = await api.simulate({
      route: routeNum,
      day_of_week: S.dow,
      hour: hourVal,
      action: 'add',
      extra_trips: 2
    });
  } catch (e) {
    S.tier3Sim = null;
  }
  render();
}

async function runXaiCall(routeNum, depotCode, hourVal, questionKey, customQuery) {
  S.q = questionKey || 'custom';
  S.xaiLoading = true;
  render();
  try {
    S.xaiAns = await api.xaiExplain({
      route_num: routeNum || '102K',
      depot: depotCode || null,
      day_of_week: S.dow,
      hour: hourVal != null ? +hourVal : S.hour,
      question_key: questionKey || 'why_flagged',
      custom_query: customQuery || null
    });
  } catch (e) {
    S.xaiAns = {
      source: 'Offline Fallback',
      answer: 'Unable to reach /api/xai/explain endpoint.',
      metrics: {}
    };
  }
  S.xaiLoading = false;
  render();
}

async function initLoad() {
  S.loading = true;
  render();
  const [rData, al, recs, inc, bData, bnData] = await Promise.all([
    api.routes(S.mode, S.depot, S.dow, S.hour, S.riskFilter, S.search),
    api.alert(S.mode),
    api.recs(S.mode),
    api.incidents(),
    api.bottlenecks(),
    api.bunching()
  ]);
  S.items = rData.routes || [];
  S.totalRoutes = rData.total_routes ?? S.items.length;
  S.kpi = rData.kpi || { critical_count: 0, high_count: 0, normal_count: 0, avg_pressure_pct: 0 };
  S.depots = rData.depots || [];
  S.shpBounds = rData.shapefile_bounds || null;
  S.al = al || null;
  S.recs = recs || [];
  S.inc = inc || [];
  S.bottlenecks = (bData && bData.top_5_corridor_bottlenecks) ? bData.top_5_corridor_bottlenecks : [];
  S.bunching = (bnData && bnData.incidents) ? bnData.incidents : [];
  if (!S.rec && S.recs[0]) S.rec = S.recs[0].id;
  S.loading = false;
  render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;

  if (a == 'theme') {
    S.theme = S.theme == 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', S.theme);
    localStorage.setItem('dd_theme', S.theme);
    return render();
  }
  if (a == 'mode') {
    S.mode = v;
    Object.assign(S, { tier: 1, depot: 'ALL', riskFilter: 'ALL', search: '', rec: null, sim: null, simData: null, q: null, xaiAns: null });
    return initLoad();
  }
  if (a == 'alert') { S.alert = !S.alert; return render(); }
  if (a == 'depot') {
    S.depot = v;
    S.cardLimit = 60;
    return fetchTier1Routes();
  }
  if (a == 'clearfilters') {
    S.depot = 'ALL';
    S.riskFilter = 'ALL';
    S.search = '';
    S.cardLimit = 60;
    return fetchTier1Routes();
  }
  if (a == 'morecards') { S.cardLimit += 80; return render(); }
  if (a == 'allcards') { S.cardLimit = 5000; return render(); }
  if (a == 'openroute') {
    return openTier2Route(v, b.dataset.depot || '');
  }
  if (a == 'backtier1') {
    S.tier = 1;
    S.q = null;
    S.xaiAns = null;
    return render();
  }
  if (a == 'backtier2') {
    S.tier = 2;
    S.q = null;
    S.xaiAns = null;
    return render();
  }
  if (a == 'opentier3') {
    const rId = S.tier2Data ? S.tier2Data.id : '102K';
    const dCode = S.tier2Data ? S.tier2Data.depot_code : '';
    return openTier3Hour(rId, dCode, +v);
  }
  if (a == 'tier3sim') {
    return runTier3SimCall(b.dataset.route || '102K', +(b.dataset.hour ?? S.hour));
  }
  if (a == 'tab') {
    S.tab = v;
    if (v == 'net') S.tier = 1;
    if (v == 'rec' && !S.rec && S.recs[0]) S.rec = S.recs[0].id;
    return render();
  }
  if (a == 'openrec') {
    S.tab = 'rec';
    S.rec = v;
    S.sim = null;
    S.simData = null;
    S.q = null;
    S.xaiAns = null;
    S.alert = false;
    return render();
  }
  if (a == 'simulate') {
    S.sim = { act: 'add' };
    return runSimCall('add');
  }
  if (a == 'simact') {
    S.sim = { act: v };
    return runSimCall(v);
  }
  if (a == 'askxai') {
    return runXaiCall(b.dataset.route || '102K', b.dataset.depot || '', b.dataset.hour ?? S.hour, v, null);
  }
  if (a == 'selbot') { S.selBottleneck = +v; return render(); }
  if (a == 'selbunch') { S.selBunching = S.selBunching == +v ? null : +v; return render(); }
  if (a == 'report') { S.modal = true; S.sent = null; return render(); }
  if (a == 'closemodal') {
    const d = document.getElementById('dlg');
    S.modal = false;
    S.sent = null;
    d && d.open && d.close();
    return render();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id == 'dow') {
    S.dow = +e.target.value;
    if (S.tier == 3 && S.tier3Data) {
      return openTier3Hour(S.tier3Data.id, S.tier3Data.depot_code, S.tier3Data.hour);
    }
    if (S.tier == 2 && S.tier2Data) {
      return openTier2Route(S.tier2Data.id, S.tier2Data.depot_code);
    }
    return fetchTier1Routes();
  }
  if (e.target.id == 'hour') {
    S.hour = +e.target.value;
    if (S.tier == 3 && S.tier3Data) {
      return openTier3Hour(S.tier3Data.id, S.tier3Data.depot_code, S.hour);
    }
    return fetchTier1Routes();
  }
  if (e.target.id == 'riskSel') {
    S.riskFilter = e.target.value;
    return fetchTier1Routes();
  }
});

document.addEventListener('submit', async e => {
  if (e.target.id == 'searchFrm') {
    e.preventDefault();
    const inp = document.getElementById('searchInp');
    S.search = inp ? inp.value.trim() : '';
    return fetchTier1Routes();
  }
  if (e.target.id == 'xaifrm') {
    e.preventDefault();
    const f = new FormData(e.target);
    const qText = (f.get('custom_query') || '').trim();
    if (!qText) return;
    return runXaiCall(e.target.dataset.route || '102K', e.target.dataset.depot || '', e.target.dataset.hour ?? S.hour, 'custom_query', qText);
  }
  if (e.target.id != 'frm') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const incPayload = {
    type: f.get('type'),
    where: f.get('where'),
    time: f.get('time'),
    desc: f.get('desc')
  };
  const btn = e.target.querySelector('.pri');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  const created = await api.submitIncident(incPayload);
  S.inc.unshift(created);
  S.sent = created;
  const d = document.getElementById('dlg');
  d.close();
  S.modal = true;
  render();
});

initLoad();
</script>
</body>
</html>
